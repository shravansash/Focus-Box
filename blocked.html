<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pause — Focus Box</title><link rel="stylesheet" href="blocked.css"></head>
<body><main class="card"><div class="mark">F</div><p class="eyebrow">FOCUS BOX INTERVENTION</p><h1>Pause before you switch.</h1><p class="lead">This website is on your focus blocklist. Your current session is still running.</p>
<div class="prompt"><label for="domain">Website domain</label><input id="domain" placeholder="e.g. youtube.com"><label for="reason">Why do you need temporary access?</label><textarea id="reason" rows="3" placeholder="Write a specific reason. This is recorded in your local focus history."></textarea>
<label for="minutes">Temporary access</label><select id="minutes"><option value="2">2 minutes</option><option value="5" selected>5 minutes</option><option value="10">10 minutes</option><option value="15">15 minutes</option></select>
<button id="request">Request temporary access</button><p id="message" role="status"></p></div><a href="dashboard.html">Return to Focus Box dashboard</a></main><script src="blocked.js"></script></body></html>
